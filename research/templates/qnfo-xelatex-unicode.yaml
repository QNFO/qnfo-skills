# QNFO XeLaTeX Unicode Configuration for Pandoc
# 
# PURPOSE: This is the HOLISTIC SOLUTION to Unicode rendering in PDFs.
# Instead of converting Unicode characters to LaTeX via dictionaries,
# we configure XeLaTeX to use fonts that HAVE the Unicode glyphs.
#
# The unicode-math package + STIX Two Math font provides complete
# coverage of Unicode mathematical symbols, Greek letters, subscripts,
# superscripts, blackboard bold, and all other mathematical notation.
#
# USAGE:
#   pandoc paper.md -o paper.pdf --pdf-engine=xelatex \
#     --defaults=templates/qnfo-xelatex-unicode.yaml
#
# Or include the header-includes directly in your paper's YAML frontmatter.

# PDF engine must be xelatex for unicode-math to work
pdf-engine: xelatex

# Variables passed to the LaTeX template
variables:
  # Use fontspec for main text fonts
  mainfont: "TeX Gyre Pagella"
  sansfont: "TeX Gyre Heros"
  monofont: "DejaVu Sans Mono"
  
  # Math font with FULL Unicode coverage
  mathfont: "STIX Two Math"
  
  # Document class options
  documentclass: article
  classoption:
    - 11pt
    - a4paper
  
  # Geometry
  geometry:
    - margin=1in

# Header includes for unicode-math configuration
header-includes: |
  % === UNICODE MATH CONFIGURATION ===
  % This is the CORRECT solution for Unicode in XeLaTeX PDFs.
  % Instead of converting Unicode to LaTeX commands, we use fonts
  % that contain the actual Unicode glyphs.
  
  \usepackage{fontspec}
  \usepackage{unicode-math}
  
  % STIX Two Math has comprehensive Unicode mathematical symbol coverage
  % including: Greek (U+0370-03FF), Mathematical Operators (U+2200-22FF),
  % Supplemental Mathematical Operators (U+2A00-2AFF), Mathematical
  % Alphanumeric Symbols (U+1D400-1D7FF), Letterlike Symbols (U+2100-214F),
  % Number Forms including subscripts/superscripts (U+2070-209F), etc.
  \setmathfont{STIX Two Math}
  
  % Fallback: if a glyph is missing from STIX Two Math, try Latin Modern Math
  % (This should rarely be needed, but provides a safety net)
  \setmathfont{Latin Modern Math}[range={}]
  
  % Main text font with good Unicode coverage
  \setmainfont{TeX Gyre Pagella}[
    Ligatures=TeX,
    Numbers=OldStyle
  ]
  
  % Sans and mono fonts
  \setsansfont{TeX Gyre Heros}
  \setmonofont{DejaVu Sans Mono}[Scale=0.9]
  
  % === KEY INSIGHT ===
  % With unicode-math loaded and STIX Two Math set, you can write:
  %   ℚ, ℝ, ℂ, ℤ, ℕ, 𝔸 (blackboard bold)
  %   α, β, γ, δ, ... ω (Greek)
  %   ₀, ₁, ₂, ... ₉, ₐ, ₑ, ₒ, ₓ, ₕ, ₖ, ₗ, ₘ, ₙ, ₚ, ₛ, ₜ (subscripts)
  %   ⁰, ¹, ², ³, ... ⁹ (superscripts)
  %   ħ, ℓ, ∞, ∂, ∇, ∑, ∏, ∫ (math symbols)
  % directly in your text, and they will render correctly WITHOUT
  % needing to wrap them in $...$ or convert them to \mathbb{Q} etc.
  %
  % The font contains the glyphs; no conversion needed.
